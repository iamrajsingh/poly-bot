[project]
name = "polyengine"
version = "0.1.0"
description = "24x7 research and trading engine for Polymarket"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.17,<2",
    "py-clob-client>=0.34",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "feedparser>=6.0",
    "rapidfuzz>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
polyengine = "polyengine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["polyengine*"]

[tool.setuptools.package-data]
polyengine = ["web/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
